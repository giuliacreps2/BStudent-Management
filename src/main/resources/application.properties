spring.application.name=BStudent-Management
spring.config.import=file:env.properties
server.port=${PORT}
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
jwt.secret=${JWT_SECRET}
#COOKIE
cookie.secure=false
#CORS (origini separate da virgola)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
#RESEND
resend.api-key=${RESEND.API-KEY}
resend.from=${RESEND_FROM:BStudent <onboarding@resend.dev>}
#STRIPE
# TODO (billing, punto 1): stripe.secret-key=${STRIPE_SECRET_KEY} e stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
# (chiavi in env.properties); vedi services/billing/package-info.java
#FRONTEND (base dei link nelle email)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
#REGISTRAZIONE
# Eta' del consenso digitale in Italia (art. 2-quinquies Codice privacy): sotto serve il genitore/tutore
registration.digital-consent-age=14
registration.request-ttl=7d
registration.max-sends=5
registration.resend-cooldown=60s
# Versione corrente dell'informativa privacy accettata in registrazione
registration.policy-version=${PRIVACY_POLICY_VERSION:v0.1}
#AUTH (token monouso in auth_tokens)
auth.password-reset-ttl=1h
auth.email-verification-ttl=24h
auth.token-request-cooldown=60s
#GOOGLE OAUTH2 (redirect URI da registrare su Google Cloud: {baseUrl}/login/oauth2/code/google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
